<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ff6b00">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Woordjes">
    <meta name="format-detection" content="telephone=no">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <title>Woordjes – Dutch Vocabulary</title>
</head>

<body>
    <header class="topbar">
        <h1 id="title">Woordjes</h1>
        <div id="study-bar" class="study-bar" hidden>
            <div class="study-row">
                <select id="list-select" aria-label="Word list"></select>
                <button id="direction-btn" class="chip" type="button" aria-label="Toggle quiz direction">NL → EN</button>
            </div>
            <div class="study-row">
                <select id="order-select" aria-label="Word order">
                    <option value="random">Random</option>
                    <option value="seq">Sequential</option>
                    <option value="alpha">A–Z</option>
                </select>
                <select id="chapter-select" aria-label="Chapter" hidden></select>
            </div>
        </div>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar" aria-label="Main">
        <a href="#lists" data-tab="lists">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 5h16M4 12h16M4 19h10" />
            </svg>
            <span>Lists</span>
        </a>
        <a href="#upload" data-tab="upload">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 16V4M6 10l6-6 6 6M4 20h16" />
            </svg>
            <span>Add</span>
        </a>
        <a href="#cards" data-tab="cards">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="6" width="14" height="12" rx="2" />
                <path d="M7 3h12a2 2 0 0 1 2 2v10" />
            </svg>
            <span>Cards</span>
        </a>
        <a href="#mc" data-tab="mc">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="6" cy="7" r="2" />
                <circle cx="6" cy="17" r="2" />
                <path d="M11 7h9M11 17h9" />
            </svg>
            <span>Quiz</span>
        </a>
        <a href="#type" data-tab="type">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="2" y="6" width="20" height="12" rx="2" />
                <path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10" />
            </svg>
            <span>Type</span>
        </a>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="store.js"></script>
    <script src="app.js"></script>
</body>

</html>
